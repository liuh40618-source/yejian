name: CI
run-name: CI · ${{ github.head_ref || github.ref_name }}

# Fork-scoped CI. Upstream also gated browser tests, a Cloudflare bundle check, a Vercel build, and a
# live deployment smoke test; all four need either upstream's paid runners, their cloud project, or
# their deployment secrets. What a contributor to this fork needs is lint, typecheck, and unit tests,
# so that is what runs here.
on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Lint, typecheck and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_URL: http://localhost:3000
      PORT: "3000"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      # Public fixtures for disposable CI services. Random values invalidate every Turbo test key.
      AUTH_SECRET: isolated-ci-auth-secret-32-characters
      ENCRYPTION_SECRET: isolated-ci-encryption-secret-32-characters
      FLAG_DISABLE_SIGNUPS: "false"
      FLAG_DISABLE_EMAIL_AUTH: "false"
      FLAG_ENABLE_GUEST_LOGIN: "true"
      FLAG_DISABLE_API_RATE_LIMIT: "true"
      LOCAL_STORAGE_PATH: /tmp/yejian-e2e-storage
      # The assistant spec talks to a scripted provider on 127.0.0.1.
      FLAG_ALLOW_UNSAFE_AI_BASE_URL: "true"
      # Real-database unit suites. The cover-letter suite works in its own schema; the OAuth flow suite
      # writes signing keys under its own secret, so it gets a database the e2e server never reads.
      COVER_LETTER_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      INTEGRATIONS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      OAUTH_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/oauth_test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Restore and save Turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-${{ runner.arch }}-turbo-${{ github.workflow }}-${{ hashFiles('pnpm-lock.yaml', '.nvmrc') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-turbo-${{ github.workflow }}-${{ hashFiles('pnpm-lock.yaml', '.nvmrc') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and formatting
        run: |
          pnpm lint
          pnpm format:check

      - name: Review documentation drift
        env:
          DOCS_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: |
          if git diff --quiet "$DOCS_BASE_REF" HEAD -- docs/ tooling/docs/; then
            exit 0
          fi
          pnpm docs:check

      - name: Check package boundaries
        run: pnpm exec turbo boundaries

      - name: Typecheck
        run: pnpm exec turbo run typecheck

      - name: Install PDF text extraction tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Prepare test storage
        run: mkdir -p "$LOCAL_STORAGE_PATH"

      - name: Migrate test database
        run: pnpm db:migrate

      - name: Create and migrate OAuth test database
        run: |
          psql "$DATABASE_URL" -c "CREATE DATABASE oauth_test"
          DATABASE_URL="$OAUTH_TEST_DATABASE_URL" pnpm db:migrate

      # Two workers suit a stock 4-vCPU GitHub runner; more oversubscribes PDF rendering and hits
      # the rate-limit suites' timeouts.
      - name: Run unit tests
        run: pnpm exec turbo run test:ci --concurrency=2
